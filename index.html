<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🖨️ PrintShop</h1>
            <p>Fast & Easy Printing</p>
        </header>

        <!-- SHOP STATUS -->
        <div id="shopStatus" class="shop-status">
         Online
        </div>

        <!-- MAIN SINGLE CARD (Merged All Input Sections) -->
        <section class="card main-form-card">
            
            <!-- UPLOAD SECTION -->
            <div class="card-section">
                <h2>Upload File</h2>
                <label for="fileInput" class="upload-box">
                    <div class="upload-icon">📄</div>
                    <div class="upload-title">Upload File</div>
                    <div class="upload-subtitle">Tap here to select your File</div>
                </label>
                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.jpg,.jpeg,.png,.webp"
                    multiple
                    hidden
                >
                <div id="fileList"></div>
            </div>

            <!-- PRINT TYPE SECTION -->
            <div class="card-section">
                <h2>Print Type</h2>
                <div class="print-options">
                    <label class="print-option selected">
                        <input
                            type="radio"
                            id="typeBW"
                            name="printType"
                            value="bw"
                            checked
            
                            >
                        <div class="print-content">
                            <div class="print-name">
                                <span class="black-circle">●</span>
                                B/W
                            </div>
                            <div class="print-price" id="bwPriceLabel">
                                ₹ / page
                            </div>
                        </div>
                    </label>

                    <label class="print-option">
                        <input
                            type="radio"
                            name="printType"
                            value="color"
                        >
                        <div class="print-content">
                            <div class="print-name">
                                🌈 Colour
                            </div>
                            <div class="print-price" id="colorPriceLabel">
                                ₹ / page
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- COPIES SECTION -->
            <div class="card-section">
                <h2>Copies</h2>
                <input
                    type="number"
                    id="copies"
                    min="1"
                    value="1"
                >
            </div>

            <!-- TOTAL SECTION -->
            <div class="card-section total-card">
                <div>
                    <span>Total Pages</span>
                    <strong id="totalPages">0</strong>
                </div>
                <div>
                    <span>Total Amount</span>
                    <strong id="totalAmount">₹0</strong>
                </div>
            </div>

        </section>

        <button id="orderBtn" class="primary-btn">
            Continue
        </button>

        <!-- SUMMARY -->
        <section id="summary" class="card summary hidden">

            <h2>Order Summary</h2>

            <p>
                <strong>Order ID:</strong>
                <span id="orderId"></span>
            </p>

            <p>
                <strong>Files:</strong>
                <span id="summaryFiles"></span>
            </p>

            <p>
                <strong>Pages:</strong>
                <span id="summaryPages"></span>
            </p>

            <p>
                <strong>Print Type:</strong>
                <span id="summaryType"></span>
            </p>

            <p>
                <strong>Copies:</strong>
                <span id="summaryCopies"></span>
            </p>

            <p>
                <strong>Total:</strong>
                ₹<span id="summaryTotal"></span>
            </p>

            <!-- ORDER STATUS -->
            <div id="orderStatusBox" class="order-status">
                🟡 Order Pending
            </div>

            <div class="payment-buttons">

                <button id="payBtn" class="primary-btn">
                    💳 Online Pay
                </button>

                <button id="cashBtn" class="secondary-btn">
                    💵 Pay Cash
                </button>

            </div>

            <button id="editBtn" class="edit-btn">
                 ← Edit Order
            </button>

        </section>

        <!-- FOOTER -->
        <p class="footer">
            Fast • Simple • No Queue
        </p>

    </div>

    <script src="script.js?v=4"></script>

</body>
</html>
