<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🖨️ PrintShop</h1>
            <p>Fast & Easy Printing</p>
        </header>

        <!-- SHOP STATUS -->
        <div id="shopStatus" class="shop-status">
         Online
        </div>

        <!-- UPLOAD -->
        <section class="card">
            <h2>Upload Files</h2>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.jpg,.jpeg,.png,.webp"
                multiple
            >

            <div id="fileList"></div>
        </section>

        <!-- PRINT TYPE -->
        <section class="card">
            <h2>Print Type</h2>

            <div class="print-options">

                <label>
                    <input type="radio" name="printType" value="bw" checked>
                    <span>
                        🖤 Black & White
                        <small id="bwPriceLabel">₹ / page</small>
                    </span>
                </label>

                <label>
                    <input type="radio" name="printType" value="color">
                    <span>
                        🌈 Colour
                        <small id="colorPriceLabel">₹ / page</small>
                    </span>
                </label>

            </div>
        </section>

        <!-- COPIES -->
        <section class="card">
            <h2>Copies</h2>

            <input
                type="number"
                id="copies"
                min="1"
                value="1"
            >
        </section>

        <!-- TOTAL -->
        <section class="card total-card">

            <div>
                <span>Total Pages</span>
                <strong id="totalPages">0</strong>
            </div>

            <div>
                <span>Total Amount</span>
                <strong id="totalAmount">₹0</strong>
            </div>

        </section>

        <button id="orderBtn" class="primary-btn">
            Continue
        </button>

        <!-- SUMMARY -->
        <section id="summary" class="card summary hidden">

            <h2>Order Summary</h2>

            <p>
                <strong>Order ID:</strong>
                <span id="orderId"></span>
            </p>

            <p>
                <strong>Files:</strong>
                <span id="summaryFiles"></span>
            </p>

            <p>
                <strong>Pages:</strong>
                <span id="summaryPages"></span>
            </p>

            <p>
                <strong>Print Type:</strong>
                <span id="summaryType"></span>
            </p>

            <p>
                <strong>Copies:</strong>
                <span id="summaryCopies"></span>
            </p>

            <p>
                <strong>Total:</strong>
                ₹<span id="summaryTotal"></span>
            </p>

            <!-- ORDER STATUS -->
            <div id="orderStatusBox" class="order-status">
                🟡 Order Pending
            </div>

            <div class="payment-buttons">

                <button id="payBtn" class="primary-btn">
                    💳 Online Pay
                </button>

                <button id="cashBtn" class="secondary-btn">
                    💵 Pay Cash
                </button>

            </div>

            <button id="editBtn" class="edit-btn">
                ✏️ Edit Order
            </button>

        </section>

        <footer>
            <p>PrintShop © 2026</p>
        </footer>

    </div>

    <script src="script.js?v=3"></script>

</body>
</html>
