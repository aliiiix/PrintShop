<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintShop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>
<body>

    <div class="container">

        <header>
            <h1>🖨️ PrintShop</h1>
            <p>Fast & Easy Printing</p>
        </header>

        <!-- SHOP STATUS BADGE -->
        <div id="shopStatusBadge" class="shop-status">
            Online
        </div>

        <!-- MAIN FORM CARD -->
        <section id="mainFormCard" class="card main-form-card">
            
            <!-- UPLOAD SECTION -->
            <div class="card-section">
                <h2>Upload File</h2>
                <label for="fileInput" class="upload-box" id="fileDropArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-title" id="fileNameDisplay">Upload File</div>
                    <div class="upload-subtitle">Tap here to select your File</div>
                </label>
                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.jpg,.jpeg,.png,.webp"
                    multiple
                    hidden
                >
                    
    <!-- Dynamic File List & Thumbnail Container -->
    <div id="fileListContainer" class="file-list-container"></div>
</div>

            <!-- PRINT TYPE SECTION -->
            <div class="card-section">
                <h2>Print Type</h2>
                <div class="print-options">
            <label class="print-option selected">


                        <input
                            type="radio"
                            id="typeBW"
                            name="printType"
                            value="bw"
                            checked
                            </label>
                        
                        <div class="print-content">
                            <div class="print-name">
                                <span class="black-circle">●</span>
                                B/W
                            </div>
                            <div class="print-price" id="bwPriceLabel">
                                ₹2 / page
                            </div>
                        </div>
                    </label>

                    <label class="print-option">
                        <input
                            type="radio"
                            id="typeColor"
                            name="printType"
                            value="color"
                        >
                        <div class="print-content">
                            <div class="print-name">
                                🌈 Colour
                            </div>
                            <div class="print-price" id="colorPriceLabel">
                                ₹10 / page
                            </div>
                        </div>
                    </label>
                </div>
            </div>
        

            <!-- COPIES SECTION -->
            <div class="card-section">
                <h2>Copies</h2>
                <input
                    type="number"
                    id="copiesInput"
                    min="1"
                    value="1"
                >
            </div>

            <!-- TOTAL SECTION -->
            <div class="card-section total-card">
                <div>
                    <span>Total Pages</span>
                    <strong id="totalPages">0</strong>
                </div>
                <div>
                    <span>Total Amount</span>
                    <strong id="totalAmount">₹0</strong>
                </div>
            </div>

            <button id="orderBtn" class="primary-btn">
                Continue →
            </button>
        
        </section>
        
        <!-- Continue click sound -->
        
        <!-- ORDER SUMMARY & APPROVAL SECTION -->
        <section id="summary" class="card summary hidden">

            <h2>Order Summary</h2>

            <p>
                <strong>Order ID:</strong>
                <span id="summaryOrderId">-</span>
            </p>

            <p>
                <strong>Files:</strong>
                <span id="summaryFiles">-</span>
            </p>

            <p>
                <strong>Pages:</strong>
                <span id="summaryPages">0</span>
            </p>

            <p>
                <strong>Print Type:</strong>
                <span id="summaryType">B/W</span>
            </p>

            <p>
                <strong>Copies:</strong>
                <span id="summaryCopies">1</span>
            </p>

            <p>
                <strong>Total:</strong>
                <span id="summaryTotal">₹0</span>
            </p>

            <!-- PAYMENT BUTTONS -->
            <div id="paymentButtonsGroup" class="payment-buttons">
                <button id="payBtn" class="primary-btn">
                    💳 Online Pay
                </button>

                <button id="cashBtn" class="secondary-btn">
                    💵 Pay Cash
                </button>
            </div>

            <!-- REAL-TIME STATUS & ANIMATION BOX -->
            <div id="orderStatusContainer"></div>

            <!-- EDIT ORDER BUTTON -->
            <button id="editBtn" class="edit-btn">
                 ← Edit Order
            </button>

        </section>

        <!-- FOOTER -->
        <p class="footer">
            Fast • Simple • No Queue
        </p>

    </div>

    <script src="script.js?v=6"></script>
    <!-- Audio Tag for Click Sound -->
<audio id="clickSound" src="faaah.mp3" preload="auto"></audio>

</body>
    </html>
